# ============================================================================
# dsh-deskpet 的 bundle patch —— 把宠物插件挂进 DSH 配置树
# ============================================================================
#
# 【这是什么】
#   DSH 启动时按 bundle 层栈把各插件的 patch 叠起来组成配置树，本文件是
#   dsh-deskpet 这一层。安装后自动生效（package.json 的 dsh.bundle.patch 指向它）。
#
# 【工作原理】
#   - insert：往配置树里添加新的插件行（entry）
#   - id：行标识，patch 覆盖时按它定位
#   - name：模块名，解析到包入口 lib/index.js（宿主半侧）
#   - 因为 package.json 同时声明了 dsh.client，DSH 的模块系统还会把这个包
#     扫描为「浏览器插件」，提供 /plugins/dsh-deskpet/client.js 给页面
#     （本插件的浏览器半侧只负责设置页 GUI，宠物本体住在独立桌面窗口里）
#
# ============================================================================

- insert:
    - id: deskpet
      name: 'dsh-deskpet'
